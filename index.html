<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e3d2fa">
  <meta name="description" content="Una caja de cumpleaños y una sorpresa por descubrir.">
  <title>Cumple Dani · Caja sorpresa</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="experience" data-stage="box">
    <div class="intro">
      <p class="eyebrow">Para Dani <span aria-hidden="true">✦</span></p>
      <h1 id="headline" tabindex="-1">Caja <em>sorpresa</em></h1>
      <p class="description">Toca la caja para descubrir tu regalo.</p>
      <p class="sr-only" id="announcement" role="status"></p>
    </div>

    <div class="stage">
      <div class="presentation" id="box-panel">
        <div class="confetti" aria-hidden="true">
          <span>✦</span><span>✷</span><span>✧</span><span>✦</span><span>✹</span><span>✦</span>
        </div>
        <button class="gift-tile" id="gift-tile" type="button" aria-label="Abrir caja sorpresa">
          <span class="tile-art box-art" id="box-art" aria-hidden="true">
            <span class="box-seal">✦</span>
            <span class="asset-label">CAJA</span>
          </span>
        </button>
      </div>

      <div class="presentation reel-panel" id="reel-panel" hidden>
        <div class="reel-selector">
          <div class="reel-window">
            <div class="reel-track" id="reel-track"></div>
          </div>
          <span class="reel-pointer" aria-hidden="true"></span>
        </div>
      </div>
    </div>
  </main>

  <audio id="prize-audio" src="./audio/cancion.ogg" preload="auto" hidden></audio>
  <dialog id="prize-dialog" aria-labelledby="prize-title">
    <div class="prize-confetti" id="prize-confetti" aria-hidden="true"></div>
    <div class="reveal-screen">
      <h2 class="prize-title" id="prize-title">FELICIDADES<br>DANI</h2>
      <button class="cover-tile" id="close-prize" type="button" aria-label="Cerrar la carátula de Grand Theft Auto VI" autofocus>
        <span class="tile-art cover-art" id="cover-art" aria-hidden="true">
          <span>GTA <strong>VI</strong></span>
          <span class="asset-label">CARÁTULA</span>
        </span>
      </button>
      <img class="reveal-decoration reveal-asta" src="./images/asta.png" alt="" width="900" height="900">
      <img class="reveal-decoration reveal-gif" src="./images/evangelion1.gif" alt="" width="118" height="200">
    </div>
  </dialog>
</body>
</html>
